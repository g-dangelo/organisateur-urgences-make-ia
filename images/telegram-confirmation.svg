<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 540" width="400" height="540" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Exemple de conversation Telegram avec l'assistant</title>
  <desc id="d">Un message envoyé pour relancer le client X, suivi de la confirmation de l'assistant.</desc>
  <defs>
    <clipPath id="screen"><rect x="30" y="20" width="300" height="420" rx="26"/></clipPath>
  </defs>

  <!-- Carte de fond et titre -->
  <rect width="400" height="540" rx="20" fill="#eef3f7"/>
  <text x="200" y="38" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1c2530" text-anchor="middle">Confirmation après chaque ajout</text>
  <text x="200" y="58" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5a6b79" text-anchor="middle">Ce que l'assistant renvoie à chaque message</text>

  <g transform="translate(20,70)">

  <!-- Cadre du téléphone -->
  <rect x="20" y="10" width="320" height="440" rx="36" fill="#1c2530"/>
  <rect x="150" y="13" width="60" height="5" rx="2.5" fill="#3a4755"/>

  <g clip-path="url(#screen)" font-family="Helvetica, Arial, sans-serif">
    <!-- Fond de l'écran -->
    <rect x="30" y="20" width="300" height="420" fill="#dde6ec"/>

    <!-- En-tête -->
    <rect x="30" y="20" width="300" height="60" fill="#4a7799"/>
    <circle cx="58" cy="52" r="16" fill="#7fa6c4"/>
    <text x="58" y="57" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
    <text x="84" y="49" font-size="14" font-weight="700" fill="#ffffff">Assistant urgences</text>
    <text x="84" y="65" font-size="11" fill="#cfe0ee">bot</text>

    <!-- Pastille de date -->
    <rect x="145" y="94" width="70" height="20" rx="10" fill="#a9bccb"/>
    <text x="180" y="108" font-size="11" fill="#ffffff" text-anchor="middle">Aujourd'hui</text>

    <!-- Bulle utilisateur -->
    <rect x="82" y="128" width="236" height="98" rx="14" fill="#d4efc0"/>
    <g font-size="13" fill="#1d2b16">
      <text x="94" y="150">Rappelle-moi de relancer le</text>
      <text x="94" y="167">client X pour le devis n° 123</text>
      <text x="94" y="184">demain avant 10 h, urgent pour</text>
      <text x="94" y="201">le projet Alpha</text>
    </g>
    <text x="306" y="219" font-size="10" fill="#5f8a49" text-anchor="end">09:12</text>

    <!-- Bulle assistant -->
    <rect x="42" y="240" width="204" height="81" rx="14" fill="#ffffff"/>
    <g font-size="13" fill="#1d2530">
      <text x="54" y="262">C'est noté, je planifie la</text>
      <text x="54" y="279">relance du client X pour</text>
      <text x="54" y="296">demain à 10h.</text>
    </g>
    <text x="234" y="314" font-size="10" fill="#7a8a97" text-anchor="end">09:12</text>

    <!-- Zone de saisie -->
    <rect x="30" y="390" width="300" height="50" fill="#f3f6f8"/>
    <rect x="42" y="400" width="232" height="30" rx="15" fill="#ffffff"/>
    <text x="58" y="419" font-size="12" fill="#9aa8b3">Message</text>
    <circle cx="302" cy="415" r="15" fill="#4a7799"/>
    <rect x="297" y="407" width="10" height="16" rx="5" fill="#ffffff"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
