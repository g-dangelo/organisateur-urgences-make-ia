<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 460" width="360" height="460" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Exemple de bilan quotidien reçu sur Telegram</title>
  <desc id="d">Le bilan des urgences du jour : une action à venir sous 24 heures et le solde de jetons du mois, 4 sur 120.</desc>
  <defs>
    <clipPath id="screen"><rect x="30" y="20" width="300" height="420" rx="26"/></clipPath>
  </defs>

  <!-- Cadre du téléphone -->
  <rect x="20" y="10" width="320" height="440" rx="36" fill="#1c2530"/>
  <rect x="150" y="13" width="60" height="5" rx="2.5" fill="#3a4755"/>

  <g clip-path="url(#screen)" font-family="Helvetica, Arial, sans-serif">
    <!-- Fond de l'écran -->
    <rect x="30" y="20" width="300" height="420" fill="#dde6ec"/>

    <!-- En-tête -->
    <rect x="30" y="20" width="300" height="60" fill="#4a7799"/>
    <circle cx="58" cy="52" r="16" fill="#7fa6c4"/>
    <text x="58" y="57" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
    <text x="84" y="49" font-size="14" font-weight="700" fill="#ffffff">Assistant urgences</text>
    <text x="84" y="65" font-size="11" fill="#cfe0ee">bot</text>

    <!-- Pastille de date -->
    <rect x="145" y="94" width="70" height="20" rx="10" fill="#a9bccb"/>
    <text x="180" y="108" font-size="11" fill="#ffffff" text-anchor="middle">Aujourd'hui</text>

    <!-- Bulle du bilan -->
    <rect x="40" y="128" width="280" height="220" rx="14" fill="#ffffff"/>

    <g font-size="12.5" fill="#1d2530">
      <text x="52" y="150">BILAN DES URGENCES POUR CE JOUR</text>
      <text x="52" y="167" font-style="italic">Voici les tâches urgentes du jour :</text>

      <!-- Icône calendrier -->
      <rect x="52" y="184" width="13" height="13" rx="2" fill="#ffffff" stroke="#c9463d" stroke-width="1"/>
      <rect x="52" y="184" width="13" height="4.5" rx="1.5" fill="#e0524a"/>
      <text x="71" y="195">À VENIR SOUS 24 h</text>

      <text x="52" y="221" font-weight="700">* 31  : • Relancer le client X pour</text>
      <text x="52" y="238" font-weight="700">le devis 123</text>
      <text x="52" y="255">Status actuel : To do</text>
      <text x="52" y="272">Priorité : Haute</text>
      <text x="52" y="289">14 November à 10 h</text>
      <text x="52" y="306">Projet : alpha</text>

      <!-- Solde de jetons -->
      <text x="52" y="323" font-weight="700" font-style="italic">#</text>
      <circle cx="64" cy="319" r="5" fill="#59616b"/>
      <text x="74" y="323" font-weight="700" font-style="italic">Jetons du mois : 4/120</text>
      <path d="M232 311 L234 317 L240 319 L234 321 L232 327 L230 321 L224 319 L230 317 Z" fill="#e8b730"/>
      <text x="52" y="340" font-style="italic">encore 116 Jetons disponibles</text>
    </g>
    <text x="308" y="340" font-size="10" fill="#7a8a97" text-anchor="end">11:18</text>

    <!-- Zone de saisie -->
    <rect x="30" y="390" width="300" height="50" fill="#f3f6f8"/>
    <rect x="42" y="400" width="232" height="30" rx="15" fill="#ffffff"/>
    <text x="58" y="419" font-size="12" fill="#9aa8b3">Message</text>
    <circle cx="302" cy="415" r="15" fill="#4a7799"/>
    <rect x="297" y="407" width="10" height="16" rx="5" fill="#ffffff"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
